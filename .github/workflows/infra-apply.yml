name: infra-apply
on:
  push:
    branches: [ "master" ]
    paths:
      - "terraform/**"
      - ".github/workflows/infra-apply.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Show OIDC claims
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=$ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN is set? $([[ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]] && echo yes || echo no)"
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value' > token.jwt
          python3 - <<'PY'
          import base64, json
          t=open("token.jwt").read().split(".")[1]
          t += "=" * (-len(t) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(t)), indent=2))
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Allow GitHub runner IPs to reach EKS (dev)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          CLUSTER=ibank-eks-dev
          REGION=us-east-1

          CURRENT=$(aws eks describe-cluster --name "$CLUSTER" --region "$REGION" \
            --query 'cluster.resourcesVpcConfig.publicAccessCidrs' --output text)

          ACTIONS_CIDRS=$(curl -s https://api.github.com/meta | jq -r '.actions[]')

          tmp=$(mktemp)
          {
            for c in $CURRENT; do echo "$c"; done
            for c in $ACTIONS_CIDRS; do echo "$c"; done
          } | sort -u > "$tmp"

          aws eks update-cluster-config --name "$CLUSTER" --region "$REGION" \
            --resources-vpc-config "publicAccessCidrs=$(jq -R -s -c 'split("\n")[:-1]' "$tmp")"

      - name: Terraform Init
        working-directory: terraform/env/aws-dev
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/env/aws-dev
        run: terraform apply -auto-approve
