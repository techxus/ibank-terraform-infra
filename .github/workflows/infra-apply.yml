name: infra-apply
on:
  push:
    branches: ["master"]
    paths:
      - "terraform/**"
      - ".github/workflows/infra-apply.yml"

concurrency:
  group: infra-apply-aws-dev
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Print GitHub OIDC subject (sub)
        shell: bash
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=$ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN is set? ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: us-east-1
        env:
          ACTIONS_STEP_DEBUG: "true"

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: Runner egress IP
        id: egress
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      # optional (fragile) — keep only if you insist on github-hosted runners
      - name: Allow runner IP to reach EKS (dev)
        run: |
          set -euo pipefail
          CLUSTER=ibank-eks-dev
          REGION=us-east-1
          RUNNER_IP="${{ steps.egress.outputs.ip }}/32"
          aws eks wait cluster-active --name "$CLUSTER" --region "$REGION"
          CURRENT=$(aws eks describe-cluster --name "$CLUSTER" --region "$REGION" \
            --query 'cluster.resourcesVpcConfig.publicAccessCidrs' --output text)
          if echo "$CURRENT" | tr '\t' ' ' | grep -q "$RUNNER_IP"; then exit 0; fi
          NEW_CSV=$(echo "$CURRENT $RUNNER_IP" | tr '\t' ' ' | xargs | tr ' ' ',')
          aws eks update-cluster-config \
            --name "$CLUSTER" --region "$REGION" \
            --resources-vpc-config endpointPublicAccess=true,endpointPrivateAccess=true,publicAccessCidrs="$NEW_CSV"
          aws eks wait cluster-active --name "$CLUSTER" --region "$REGION"

      - name: Probe EKS API
        run: |
          curl -vk --max-time 8 https://9A1C1313D848FDC62201DCB75EC39225.gr7.us-east-1.eks.amazonaws.com/healthz || true

      - name: Terraform Init
        working-directory: terraform/env/aws-dev
        run: terraform init -upgrade -reconfigure

      - name: Select workspace
        working-directory: terraform/env/aws-dev
        run: terraform workspace select default

      - name: Prove state
        working-directory: terraform/env/aws-dev
        run: |
          ls -la
          test -f terraform.tfstate && echo "❌ local state in CI" || echo "✅ no local state file"
          terraform state list > /tmp/state.txt
          sed -n '1,40p' /tmp/state.txt

      - name: Ensure EKS access resources are in state (import if missing)
        working-directory: terraform/env/aws-dev
        run: |
          set -euo pipefail
      
          # Access entry already exists in AWS (you listed it earlier)
          PRINCIPAL_ARN="arn:aws:iam::121897425968:user/techxus-admin"
          CLUSTER="ibank-eks-dev"
          ADMIN_POLICY="arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
      
          # Import access entry if Terraform state doesn't have it
          if ! terraform state list | grep -q 'module.eks.module.eks.aws_eks_access_entry.this\["cluster_creator"\]'; then
            terraform import \
              'module.eks.module.eks.aws_eks_access_entry.this["cluster_creator"]' \
              "${CLUSTER}:${PRINCIPAL_ARN}"
          fi
      
          # Import policy association if Terraform state doesn't have it
          if ! terraform state list | grep -q 'module.eks.module.eks.aws_eks_access_policy_association.this\["cluster_creator_admin"\]'; then
            terraform import \
              'module.eks.module.eks.aws_eks_access_policy_association.this["cluster_creator_admin"]' \
              "${CLUSTER}#${PRINCIPAL_ARN}#${ADMIN_POLICY}"
          fi

      - name: Terraform Apply
        working-directory: terraform/env/aws-dev
        run: terraform apply -auto-approve

