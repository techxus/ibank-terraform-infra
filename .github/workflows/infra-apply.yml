name: infra-apply
on:
  push:
    branches: [ "master" ]
    paths:
      - "terraform/**"
      - ".github/workflows/infra-apply.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Show OIDC claims
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=$ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN is set? $([[ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]] && echo yes || echo no)"
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value' > token.jwt
          python3 - <<'PY'
          import base64, json
          t=open("token.jwt").read().split(".")[1]
          t += "=" * (-len(t) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(t)), indent=2))
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: terraform/envs/aws-dev
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/envs/aws-dev
        run: terraform apply -auto-approve
